# Production topology: exactly two containers.
#
#   web (Next.js + /api proxy, published)  ->  api (Express + PostgreSQL, private)
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#   Only the web container is published; its /api proxy reaches the private API.
#   There is no third service: PostgreSQL runs inside the `api` container.
name: appkings-voting
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters in the root .env}
  SESSION_HOURS: ${SESSION_HOURS:-12}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3300}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  SELF_NOMINATION_LIMIT: ${SELF_NOMINATION_LIMIT:-1}
  NOMINATION_MIN_JUSTIFICATION: ${NOMINATION_MIN_JUSTIFICATION:-20}
  TOP_PER_CATEGORY: ${TOP_PER_CATEGORY:-5}
  PHASE1_FINALISTS: ${PHASE1_FINALISTS:-15}
  PHASE2_FINALISTS_MIN: ${PHASE2_FINALISTS_MIN:-6}
  PHASE2_FINALISTS_MAX: ${PHASE2_FINALISTS_MAX:-10}
  MIN_CANDIDATES_PER_CATEGORY: ${MIN_CANDIDATES_PER_CATEGORY:-2}
  TEAM_FINALISTS: ${TEAM_FINALISTS:-3}
  COMMITTEE_PICKS_PER_CATEGORY: ${COMMITTEE_PICKS_PER_CATEGORY:-1}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
services:
  # â”€â”€ API + database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_ROLE: api
      PORT: 4000
      API_HOST: 0.0.0.0
      EMBEDDED_POSTGRES: "true"
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-appkings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:-appkings_voting}
      RUN_SEED: ${RUN_SEED:-false}
      # The entrypoint starts embedded PostgreSQL and then DERIVES DATABASE_URL for
      # 127.0.0.1:5432 with correctly URL-encoded credentials. A DATABASE_URL from .env
      # must not leak in here: `docker compose` passes it through and the API would try to
      # reach a database that is not this container.
      DATABASE_URL: ""
    expose:
      - "4000"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/api/health/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10
  # â”€â”€ Web â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ROLE: web
      PORT: 3000
      APP_PORT: 3000
      API_INTERNAL_URL: http://api:4000/api
    ports:
      - "${WEB_PORT:-3300}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
volumes:
  db_data:
    name: appkings-voting_db_data
