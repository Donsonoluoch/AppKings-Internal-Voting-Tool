; Runs the API and/or the web app inside the single runtime image.
; Which programs start is decided by APP_ROLE (see backend/docker-entrypoint.sh):
; all | api | web.
;
; PORT comes from the environment and is the public web port; the API listens on API_PORT
; (4000) and is proxied by Next.js. Both processes log to stdout, so `docker logs` shows a
; single stream.
;
; Supervisord model: every usage of %(ENV_name)s in a program section pulls the same
; section's environment, so a program can never pick up another program's PORT.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
; Express — reachable on loopback (or API_HOST) for the web proxy.
command=node src/index.js
directory=/app/backend
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; API_PORT / API_HOST come from the Dockerfile defaults and the service environment.
environment=NODE_ENV="production",PORT="%(ENV_API_PORT)s",API_HOST="%(ENV_API_HOST)s"

[program:web]
; Next.js standalone server. Proxies /api/* to API_INTERNAL_URL.
; The standalone tree mirrors the repo, so the entrypoint sits at web/frontend/server.js.
command=node frontend/server.js
directory=/app/web
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; API_INTERNAL_URL is set on the service, or derived from APP_ROLE by the entrypoint.
environment=NODE_ENV="production",PORT="%(ENV_PORT)s",HOSTNAME="0.0.0.0",API_INTERNAL_URL="%(ENV_API_INTERNAL_URL)s"
