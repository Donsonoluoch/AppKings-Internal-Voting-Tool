; Development twin of supervisord.conf: same API + web shape, but with watchers.
; Used by the `app` service in docker-compose.dev.yml (npm run dev:all).
;
; Both processes log to stdout so `docker compose logs -f app` shows one stream.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=node --watch src/index.js
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node /app/node_modules/next/dist/bin/next dev -p 3000 -H 0.0.0.0
directory=/app/frontend
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NEXT_TELEMETRY_DISABLED="1",API_INTERNAL_URL="http://127.0.0.1:4000/api"
